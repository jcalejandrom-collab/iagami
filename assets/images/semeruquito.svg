  <circle cx="163.8" cy="155.2" r="1" fill="#fff"/>
  <circle cx="169.8" cy="155.2" r="1" fill="#fff"/>
  <ellipse cx="166" cy="160" rx="2.5" ry="1.5" fill="#f4a0b0"/>

