  <path d="M100 66 Q117 37 128 33" stroke="#2d7a4f" stroke-width="1.2" fill="none"/>
  <path d="M117 37 Q121 41 117 45" stroke="#1a5c3a" stroke-width="0.8" fill="none"/>

  <!-- DESTELLO ESTRELLA en tallo -->
  <g transform="translate(104,24)">
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#ffe066" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#ffe066" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#ffe066" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#ffe066" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
