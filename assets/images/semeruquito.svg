  <!-- Estrellitas decorativas pequeñas -->
  <g transform="translate(28,78)" opacity="0.7">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#ffe066" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#ffe066" stroke-width="1.5" stroke-linecap="round"/>
