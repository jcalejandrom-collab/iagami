  <circle cx="100" cy="118" r="52" fill="url(#chr)"/>
  <!-- Brillo cereza -->
  <ellipse cx="83" cy="96" rx="16" ry="12" fill="url(#shineR)" transform="rotate(-25,83,96)"/>

  <!-- Brazitos kawaii -->
  <!-- Brazo izquierdo -->
  <ellipse cx="53" cy="128" rx="10" ry="7" fill="#e8282a" transform="rotate(30,53,128)"/>
  <ellipse cx="53" cy="128" rx="8" ry="5.5" fill="#d42022" transform="rotate(30,53,128)"/>
  <!-- Brazo derecho -->
  <ellipse cx="147" cy="128" rx="10" ry="7" fill="#e8282a" transform="rotate(-30,147,128)"/>
  <ellipse cx="147" cy="128" rx="8" ry="5.5" fill="#d42022" transform="rotate(-30,147,128)"/>

