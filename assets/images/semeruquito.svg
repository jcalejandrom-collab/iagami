<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fondo bokeh verde/azul suave -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e6cf"/>
      <stop offset="60%" stop-color="#7ecba1"/>
      <stop offset="100%" stop-color="#3d9970"/>
    </radialGradient>
    <radialGradient id="cherry" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb3c1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a3d2b" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Círculos bokeh decorativos -->
  <circle cx="30" cy="40" r="10" fill="#ffffff" opacity="0.15"/>
  <circle cx="170" cy="35" r="7" fill="#ffffff" opacity="0.12"/>
  <circle cx="20" cy="130" r="6" fill="#ffffff" opacity="0.1"/>
  <circle cx="175" cy="140" r="9" fill="#ffffff" opacity="0.13"/>
  <circle cx="155" cy="60" r="5" fill="#ffe066" opacity="0.25"/>
  <circle cx="40" cy="155" r="5" fill="#ffe066" opacity="0.2"/>

  <!-- Pasto/tierra base -->
  <ellipse cx="100" cy="175" rx="72" ry="20" fill="#2d6a4f"/>
  <ellipse cx="100" cy="170" rx="68" ry="16" fill="#40916c"/>
  <!-- Hierbita -->
  <path d="M55 165 Q52 150 57 148 Q59 158 60 165Z" fill="#52b788"/>
  <path d="M62 163 Q60 152 65 150 Q66 160 67 163Z" fill="#74c69d"/>
  <path d="M137 164 Q135 153 140 151 Q142 161 143 164Z" fill="#52b788"/>
  <path d="M145 163 Q143 154 148 152 Q149 162 150 163Z" fill="#74c69d"/>

  <!-- Ardilla (izquierda) simplificada -->
  <ellipse cx="38" cy="162" rx="12" ry="10" fill="#c9a060"/>
  <ellipse cx="38" cy="153" rx="8" ry="8" fill="#c9a060"/>
  <!-- Cola ardilla -->
  <path d="M28 165 Q15 155 20 142 Q30 148 32 162Z" fill="#b07d3a"/>
  <!-- Ojos ardilla -->
  <circle cx="35" cy="152" r="2" fill="#2d1a00"/>
  <circle cx="41" cy="152" r="2" fill="#2d1a00"/>
  <!-- Nariz ardilla -->
  <ellipse cx="38" cy="157" rx="2.5" ry="1.5" fill="#8b5e3c"/>

  <!-- Mariquita (derecha) -->
  <ellipse cx="162" cy="165" rx="10" ry="8" fill="#e63946"/>
  <circle cx="162" cy="165" r="8" fill="#e63946"/>
  <!-- Cabeza mariquita -->
  <circle cx="162" cy="156" r="6" fill="#1a0000"/>
  <!-- Manchas mariquita -->
  <circle cx="158" cy="166" r="2.5" fill="#1a0000"/>
  <circle cx="166" cy="166" r="2.5" fill="#1a0000"/>
  <circle cx="162" cy="161" r="2" fill="#1a0000"/>
  <!-- Línea mariquita -->
  <line x1="162" y1="158" x2="162" y2="173" stroke="#1a0000" stroke-width="1.2"/>
  <!-- Ojos mariquita -->
  <circle cx="159" cy="155" r="1.5" fill="#ffffff"/>
  <circle cx="165" cy="155" r="1.5" fill="#ffffff"/>

  <!-- CUERPO CEREZA KAWAII -->
  <!-- Sombra suave cereza -->
  <ellipse cx="100" cy="142" rx="38" ry="10" fill="#1a3d2b" opacity="0.2"/>

  <!-- Cuerpo principal cereza -->
  <circle cx="100" cy="118" r="45" fill="url(#cherry)" filter="url(#shadow)"/>

  <!-- Brillo cereza (reflejo claro arriba-izquierda) -->
  <ellipse cx="84" cy="99" rx="14" ry="10" fill="url(#shine)" transform="rotate(-30,84,99)"/>

  <!-- Pecas decorativas -->
  <circle cx="122" cy="105" r="2.5" fill="#c1121f" opacity="0.4"/>
  <circle cx="128" cy="115" r="2" fill="#c1121f" opacity="0.3"/>

  <!-- Mejillas kawaii -->
  <ellipse cx="74" cy="124" rx="11" ry="8" fill="url(#cheek)"/>
  <ellipse cx="126" cy="124" rx="11" ry="8" fill="url(#cheek)"/>

  <!-- Ojos kawaii (grandes, expresivos) -->
  <!-- Ojo izquierdo -->
  <ellipse cx="87" cy="114" rx="9" ry="10" fill="#1a0000"/>
  <ellipse cx="87" cy="114" rx="7.5" ry="8.5" fill="#2d1200"/>
  <circle cx="84" cy="110" r="3" fill="#ffffff"/>
  <circle cx="82" cy="109" r="1.2" fill="#ffffff"/>
  <!-- Ojo derecho -->
  <ellipse cx="113" cy="114" rx="9" ry="10" fill="#1a0000"/>
  <ellipse cx="113" cy="114" rx="7.5" ry="8.5" fill="#2d1200"/>
  <circle cx="110" cy="110" r="3" fill="#ffffff"/>
  <circle cx="108" cy="109" r="1.2" fill="#ffffff"/>

  <!-- Nariz pequeña -->
  <ellipse cx="100" cy="121" rx="2.5" ry="1.5" fill="#c1121f" opacity="0.6"/>

  <!-- Sonrisa kawaii -->
  <path d="M88 128 Q100 139 112 128" stroke="#1a0000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Dientecito -->
  <rect x="97" y="128" width="6" height="4" rx="1" fill="#ffffff"/>

  <!-- TALLO Y HOJAS -->
  <!-- Tallo -->
  <path d="M100 73 Q96 60 92 48 Q95 44 100 46 Q106 44 108 48 Q104 60 100 73Z" fill="#52b788"/>

  <!-- Hoja izquierda -->
  <ellipse cx="84" cy="44" rx="16" ry="10" fill="#40916c" transform="rotate(-35,84,44)"/>
  <path d="M84 44 Q76 48 84 52" stroke="#2d6a4f" stroke-width="1" fill="none"/>

  <!-- Hoja derecha -->
  <ellipse cx="116" cy="41" rx="16" ry="10" fill="#52b788" transform="rotate(30,116,41)"/>
  <path d="M116 41 Q124 45 116 49" stroke="#40916c" stroke-width="1" fill="none"/>

  <!-- Destello estrella (brillo) -->
  <g transform="translate(108,30)" opacity="0.9">
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ffe066" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ffe066" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Cartel de madera -->
  <rect x="38" y="178" width="124" height="20" rx="4" fill="#c9a060"/>
  <rect x="39" y="179" width="122" height="18" rx="3" fill="#dfc185"/>
  <!-- Vetas madera -->
  <line x1="50" y1="179" x2="52" y2="197" stroke="#c9a060" stroke-width="0.8" opacity="0.5"/>
  <line x1="80" y1="179" x2="78" y2="197" stroke="#c9a060" stroke-width="0.8" opacity="0.5"/>
  <line x1="130" y1="179" x2="132" y2="197" stroke="#c9a060" stroke-width="0.8" opacity="0.5"/>
  <!-- Texto cartel -->
  <text x="100" y="192" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="7.5" font-weight="900" fill="#5c3d11" letter-spacing="0.5">SEMERUQUITO · TU ASISTENTE IA</text>
</svg>
