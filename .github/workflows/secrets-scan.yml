name: Detección de Secretos

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Detectar secretos en código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para escanear todos los commits del PR

      - name: Instalar trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Escanear secretos (solo archivos tracked)
        run: |
          trufflehog filesystem . \
            --exclude-paths=.trufflehog-ignore \
            --exclude-globs=".git/**" \
            --fail \
            --no-update
