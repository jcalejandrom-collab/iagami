# IAGAMI SIGAP — Configuración Nginx
# Archivo: /etc/nginx/sites-available/iagami
# Dominio API: api.iagami.online → proxy a PocketBase en 127.0.0.1:8090
#
# Instrucciones de instalación:
#   1. cp nginx_iagami.conf /etc/nginx/sites-available/iagami
#   2. ln -s /etc/nginx/sites-available/iagami /etc/nginx/sites-enabled/iagami
#   3. apt install certbot python3-certbot-nginx -y
#   4. certbot --nginx -d api.iagami.online
#   5. nginx -t && systemctl reload nginx

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.iagami.online;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy a PocketBase
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.iagami.online;

    # SSL — certbot lo completa automáticamente
    # ssl_certificate     /etc/letsencrypt/live/api.iagami.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.iagami.online/privkey.pem;

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/iagami_access.log;
    error_log  /var/log/nginx/iagami_error.log;

    # Proxy a PocketBase
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # WebSocket / SSE (PocketBase realtime)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para uploads hasta 10MB
        proxy_read_timeout    300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;

        # Tamaño máximo de archivos (10MB como define IAGAMI)
        client_max_body_size 10M;
    }
}
